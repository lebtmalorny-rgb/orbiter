[project]
name = "orbiter"
version = "0.1.0"
description = "Two-body satellite orbit visualizer."
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pillow>=11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
  "venv",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035"]

[tool.ruff.lint.per-file-ignores]
"third_matplotlib_legacy.py" = ["E402"]
