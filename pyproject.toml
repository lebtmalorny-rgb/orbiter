[project]
name = "orbiter"
version = "0.1.0"
description = "Local WebGL satellite orbit visualizer."
requires-python = ">=3.9"
dependencies = [
  "numpy>=2.0",
  "skyfield>=1.49",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
  "venv",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035"]
