<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>3D визуализация движения спутника</title>
  <style>
    :root {
      --panel: #f5f7fb;
      --panel-border: #d5dbe8;
      --text: #172033;
      --muted: #596579;
      --accent: #d62828;
      --accent-dark: #8f1111;
      --blue: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0b1020;
    }

    #app {
      display: grid;
      grid-template-columns: minmax(300px, 360px) 1fr;
      width: 100vw;
      height: 100vh;
    }

    #controls {
      overflow-y: auto;
      padding: 14px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
    }

    #scene {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    canvas {
      display: block;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.2;
    }

    fieldset {
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: #ffffff;
    }

    legend {
      padding: 0 5px;
      color: #26334a;
      font-weight: 650;
      font-size: 14px;
    }

    label {
      display: grid;
      grid-template-columns: minmax(96px, 1fr) minmax(100px, 128px);
      gap: 8px;
      align-items: center;
      margin: 7px 0;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    select,
    button {
      min-height: 30px;
      border-radius: 6px;
      font: inherit;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #c4ccda;
      padding: 4px 7px;
      color: var(--text);
      background: #ffffff;
    }

    button {
      border: 0;
      padding: 6px 10px;
      color: #ffffff;
      background: var(--blue);
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .wide {
      width: 100%;
      margin-top: 6px;
    }

    .danger {
      background: var(--accent);
    }

    .secondary {
      background: #475569;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 8px;
    }

    .grid-2 label {
      grid-template-columns: minmax(58px, 1fr) minmax(72px, 100px);
    }

    .note,
    #summary {
      white-space: pre-line;
      color: #42506a;
      font-size: 13px;
      line-height: 1.35;
    }

    #hud {
      position: absolute;
      left: 16px;
      top: 16px;
      min-width: 170px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      color: #f8fafc;
      background: rgba(10, 16, 32, 0.72);
      font-size: 15px;
      line-height: 1.35;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    #noradPanel {
      position: absolute;
      left: 16px;
      top: 104px;
      width: min(330px, calc(100% - 32px));
      max-height: calc(100% - 140px);
      overflow: hidden;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      color: #e5edf8;
      background: rgba(10, 16, 32, 0.66);
      font-size: 12px;
      line-height: 1.34;
      white-space: pre-line;
      pointer-events: none;
      backdrop-filter: blur(6px);
      display: none;
    }

    #error {
      position: absolute;
      right: 16px;
      top: 16px;
      max-width: 360px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #ffffff;
      background: rgba(190, 18, 60, 0.92);
      font-size: 14px;
      display: none;
    }

    #scene canvas {
      cursor: grab;
    }

    #scene canvas:active {
      cursor: grabbing;
    }

    #view-panel {
      position: absolute;
      right: 18px;
      bottom: 22px;
      display: grid;
      gap: 7px;
      width: 64px;
      z-index: 5;
      pointer-events: auto;
    }

    #view-panel button {
      display: grid;
      place-items: center;
      min-height: 30px;
      border: 1px solid rgba(226, 232, 240, 0.22);
      border-radius: 999px;
      color: #f8fafc;
      background: rgba(9, 15, 30, 0.72);
      background-image: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.26);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      appearance: none;
      backdrop-filter: blur(8px);
      user-select: none;
    }

    #view-panel button:hover,
    #view-panel button.active {
      border-color: rgba(125, 211, 252, 0.9);
      background: rgba(14, 116, 144, 0.78);
      filter: none;
    }

    .view-home {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      justify-self: center;
      font-size: 16px;
      line-height: 1;
    }

    .view-compass {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      width: 64px;
    }

    .compass-button {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      min-height: 29px;
      padding: 0;
      font-size: 10px;
    }

    .compass-north {
      grid-column: 1 / -1;
      justify-self: center;
      color: #c7d2fe;
      background: rgba(49, 46, 129, 0.72);
    }

    .compass-front {
      color: #bbf7d0;
      background: rgba(20, 83, 45, 0.72);
    }

    .compass-right {
      color: #fca5a5;
      background: rgba(127, 29, 29, 0.7);
    }

    .compass-axis {
      display: none;
    }

    .view-zoom,
    .view-follow,
    .view-extra,
    .plane-switches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .view-zoom button,
    .view-follow button,
    .view-extra button {
      height: 30px;
      min-height: 30px;
      padding: 0;
    }

    .view-extra button,
    .plane-switch span {
      font-size: 10px;
    }

    .view-follow {
      grid-template-columns: 1fr;
    }

    #viewFollow.following {
      border-color: rgba(250, 204, 21, 0.95);
      color: #fffbeb;
      background: rgba(161, 98, 7, 0.86);
    }

    .plane-switch {
      position: relative;
      display: block;
      margin: 0;
    }

    .plane-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .plane-switch span {
      display: grid;
      place-items: center;
      height: 30px;
      border: 1px solid rgba(148, 163, 184, 0.48);
      border-radius: 999px;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.82);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      appearance: none;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
    }

    .plane-switch input:checked + span {
      border-color: rgba(251, 191, 36, 0.9);
      color: #f8fafc;
      background: rgba(120, 83, 20, 0.82);
    }

    @media (max-width: 860px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 42vh 58vh;
      }

      #controls {
        order: 2;
        border-right: 0;
        border-top: 1px solid var(--panel-border);
      }

      #scene {
        order: 1;
      }

      #view-panel {
        right: 10px;
        bottom: 10px;
        transform: scale(0.86);
        transform-origin: bottom right;
      }

      #error {
        top: 10px;
        right: 10px;
        max-width: calc(100vw - 20px);
      }

      #noradPanel {
        left: 10px;
        top: 92px;
        width: calc(100vw - 92px);
        max-height: calc(42vh - 104px);
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="controls">
      <h1>3D движение спутника</h1>

      <fieldset>
        <legend>Готовая орбита</legend>
        <select id="preset"></select>
        <div id="preset-info" class="note"></div>
      </fieldset>

      <fieldset>
        <legend>Реальное время</legend>
        <label>Группа <select id="realtimeGroup">
          <option value="STATIONS">STATIONS</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="VISUAL">VISUAL</option>
          <option value="WEATHER">WEATHER</option>
          <option value="RESOURCE">RESOURCE</option>
          <option value="GPS-OPS">GPS-OPS</option>
        </select></label>
        <label>Аппарат <select id="realtimeSatellite"></select></label>
        <label>Спутник <input id="realtimeQuery" type="text" value="ISS"></label>
        <button class="wide" id="loadRealtime">Загрузить SGP4/UTC</button>
        <div id="realtimeInfo" class="note"></div>
      </fieldset>

      <fieldset>
        <legend>Параметры орбиты</legend>
        <div class="grid-2">
          <label>a, км <input id="semiMajorAxis" type="number" step="1"></label>
          <label>e <input id="eccentricity" type="number" step="0.0001" min="0" max="0.99"></label>
          <label>i, град <input id="inclinationDeg" type="number" step="0.1"></label>
          <label>Omega <input id="raanDeg" type="number" step="0.1"></label>
          <label>omega <input id="argPerigeeDeg" type="number" step="0.1"></label>
          <label>nu <input id="trueAnomalyDeg" type="number" step="0.1"></label>
        </div>
        <button class="wide" id="applyOrbit">Применить параметры орбиты</button>
      </fieldset>

      <fieldset>
        <legend>Координаты, км</legend>
        <label>X0 <input id="x0" type="number" step="0.1"></label>
        <label>Y0 <input id="y0" type="number" step="0.1"></label>
        <label>Z0 <input id="z0" type="number" step="0.1"></label>
      </fieldset>

      <fieldset>
        <legend>Скорости, км/с</legend>
        <label>Vx0 <input id="vx0" type="number" step="0.001"></label>
        <label>Vy0 <input id="vy0" type="number" step="0.001"></label>
        <label>Vz0 <input id="vz0" type="number" step="0.001"></label>
        <label>V <input id="speed" type="number" step="0.001"></label>
        <button class="wide" id="applySpeed">Применить V</button>
      </fieldset>

      <fieldset>
        <legend>Расчет</legend>
        <label>Шаг dt, с <input id="dt" type="number" step="0.5" min="0.1"></label>
        <label>Длительность, мин <input id="durationMin" type="number" step="10" min="1"></label>
        <label>Скорость анимации <input id="animationRate" type="number" step="0.5" min="0.1"></label>
        <label>Модель <select id="forceModel">
          <option value="twoBody">2 тела</option>
          <option value="j2">J2</option>
        </select></label>
        <label>Поверх Земли <input id="alwaysVisible" type="checkbox" checked></label>
      </fieldset>

      <div class="button-row">
        <button id="run">Построить</button>
        <button class="secondary" id="stop">Стоп</button>
        <button class="danger" id="reset">Сброс</button>
      </div>

      <fieldset>
        <legend>Сводка</legend>
        <div id="summary"></div>
      </fieldset>
    </aside>

    <main id="scene">
      <div id="hud">t = 0.0 мин<br>V = 0.000 км/с</div>
      <div id="noradPanel"></div>
      <nav id="view-panel" aria-label="Управление видом">
        <button id="viewGeneral" class="view-home active" type="button" aria-label="Домой над Москвой" title="Домой над Москвой">⌂</button>
        <div class="view-compass" aria-label="Компас вида">
          <div class="compass-axis x"></div>
          <div class="compass-axis y"></div>
          <div class="compass-axis z"></div>
          <button id="viewEquator" class="compass-button compass-north" type="button" title="Вид вдоль +Z">Z</button>
          <button id="viewFront" class="compass-button compass-front" type="button" title="Вид вдоль -Y">Y</button>
          <button id="viewRight" class="compass-button compass-right" type="button" title="Вид вдоль +X">X</button>
        </div>
        <div class="view-zoom">
          <button id="viewZoomIn" type="button" title="Приблизить">+</button>
          <button id="viewZoomOut" type="button" title="Отдалить">-</button>
        </div>
        <div class="view-follow">
          <button id="viewFollow" type="button" aria-label="Следить за спутником" title="Следить за спутником">SAT</button>
        </div>
        <div class="view-extra">
          <button id="viewEcliptic" type="button" title="Вид вдоль нормали эклиптики">ECL</button>
          <button id="viewOrbit" type="button" title="Вид вдоль нормали орбиты">ORB</button>
        </div>
        <div class="plane-switches">
          <label class="plane-switch" title="Показать плоскость экватора">
            <input id="showEquatorPlane" type="checkbox">
            <span>EQ</span>
          </label>
          <label class="plane-switch" title="Показать плоскость эклиптики">
            <input id="showEclipticPlane" type="checkbox">
            <span>ECL</span>
          </label>
          <label class="plane-switch" title="Показать оси X/Y/Z">
            <input id="showAxes" type="checkbox">
            <span>AX</span>
          </label>
          <label class="plane-switch" title="Показать радиус-вектор спутника">
            <input id="showRadiusVector" type="checkbox">
            <span>R</span>
          </label>
        </div>
      </nav>
      <div id="error"></div>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./assets/three.module.min.js",
        "three/addons/controls/OrbitControls.js": "./assets/OrbitControls.js"
      }
    }
  </script>

      'realtimeGroup', 'realtimeSatellite', 'realtimeQuery', 'loadRealtime', 'realtimeInfo',
      'raanDeg', 'argPerigeeDeg', 'trueAnomalyDeg', 'x0', 'y0', 'z0',
      'vx0', 'vy0', 'vz0', 'speed', 'dt', 'durationMin', 'animationRate', 'forceModel',
      'alwaysVisible', 'run', 'stop', 'reset', 'applyOrbit', 'applySpeed',
      'viewGeneral', 'viewEquator', 'viewFront', 'viewRight', 'viewZoomIn', 'viewZoomOut',
      'viewFollow', 'viewEcliptic', 'viewOrbit',
      'showEquatorPlane', 'showEclipticPlane', 'showAxes', 'showRadiusVector',
      'summary', 'hud', 'noradPanel', 'error', 'scene'
    ];
    const el = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]));
    const compassAxes = {
      x: document.querySelector('.compass-axis.x'),
      y: document.querySelector('.compass-axis.y'),
      z: document.querySelector('.compass-axis.z')
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08101f);

    const camera = new THREE.PerspectiveCamera(45, sceneAspect(), 10, 240000);
    camera.position.set(16500, -19000, 13000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(el.scene.clientWidth, el.scene.clientHeight);
    el.scene.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.72;
    controls.zoomSpeed = 0.84;
    controls.panSpeed = 0.48;
    controls.screenSpacePanning = false;
    controls.minDistance = R_EARTH * 1.08;
    controls.maxDistance = 240000;
    controls.minTargetRadius = 0;
    controls.maxTargetRadius = R_EARTH * 0.35;
    controls.cursor.set(0, 0, 0);
    controls.listenToKeyEvents(window);

    scene.add(new THREE.AmbientLight(0xffffff, 1.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(2, -1, 1.5);
    scene.add(sun);

    const earthTexture = new THREE.TextureLoader().load('./assets/earth_blue_marble_2048.jpg');
    earthTexture.colorSpace = THREE.SRGBColorSpace;
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(R_EARTH, 128, 64),
      new THREE.MeshPhongMaterial({
        map: earthTexture,
        transparent: true,
        opacity: 0.92,
        shininess: 8
      })
    );
    earth.rotation.x = Math.PI / 2;
    scene.add(earth);

    const atmosphere = makeAtmosphere();
    scene.add(atmosphere);

    const earthGraticule = makeEarthGraticule();
    scene.add(earthGraticule);

    const moscowHomeMarker = makeGroundMarker(
      MOSCOW_HOME.label,
      MOSCOW_HOME.latitudeDeg,
      MOSCOW_HOME.longitudeDeg
    );
    scene.add(moscowHomeMarker.group);

    const equatorGreatCircle = new THREE.Line(
      circleGeometry(R_EARTH * 1.002, 256, 'xy'),
      new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.46,
        depthWrite: false
      })
    );
    const eclipticGreatCircle = new THREE.Line(
      circleGeometry(R_EARTH * 1.006, 256, 'xy'),
      new THREE.LineBasicMaterial({
        color: 0xfbbf24,
        transparent: true,
        opacity: 0.5,
        depthWrite: false
      })
    );
    eclipticGreatCircle.rotation.x = degToRad(EARTH_OBLIQUITY_DEG);
    scene.add(equatorGreatCircle, eclipticGreatCircle);

    const equatorPlane = makeReferencePlane(0x38bdf8, 0.02);
    const eclipticPlane = makeReferencePlane(0xfbbf24, 0.024);
    eclipticPlane.rotation.x = degToRad(EARTH_OBLIQUITY_DEG);
    scene.add(equatorPlane, eclipticPlane);

    const earthAxes = makeEarthAxes();
    const axisLabelSprites = earthAxes.labels;
    const axisCenterSprite = earthAxes.center;
    scene.add(earthAxes.group);

    const orbitLine = makeLine(0x7dd3fc, 0.28, false);
    const orbitLineVisible = makeLine(0xfff7ed, 0.92, true);
    const trailLine = makeLine(0xffea00, 1.0, true);
    const positionVectorLine = makeLine(0x93c5fd, 0.62, false);
    scene.add(orbitLine, orbitLineVisible, trailLine, positionVectorLine);

    const satellite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeSatelliteMarkerTexture(),
      transparent: true,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    }));
    satellite.renderOrder = 14;
    scene.add(satellite);

    let history = [];
    let times = [];
    let speeds = [];
    let sampleUtcTimes = [];
    let renderPositions = [];
    let renderStride = 1;
    let frameIndex = 0;
    let playing = true;
    let lastTimestamp = 0;
    let simulationClock = 0;
    let viewDistance = 25000;
    let syncingCamera = false;
    let followSatellite = false;
    let activeTrajectory = { type: 'model' };
    let lastRealtimeAutoQuery = realtimeGroupDefaults.STATIONS;
    let realtimeRefreshTimer = null;

    resizeRenderer();
    initControls();
    applyPreset('МКС');
    runSimulation();
    animate(0);

    window.addEventListener('resize', resizeRenderer);
    el.run.addEventListener('click', runSimulation);
    el.stop.addEventListener('click', () => { playing = false; });
    el.reset.addEventListener('click', resetToStart);
    el.applyOrbit.addEventListener('click', applyOrbitParameters);
    el.applySpeed.addEventListener('click', applySpeed);
    el.loadRealtime.addEventListener('click', () => loadRealtimeTrajectory());
    el.realtimeSatellite.addEventListener('change', applyRealtimeCatalogSelection);
    el.realtimeQuery.addEventListener('input', () => { el.realtimeSatellite.value = 'custom'; });
    el.realtimeGroup.addEventListener('change', () => refreshRealtimeSatelliteOptions(false));
    el.preset.addEventListener('change', () => applyPreset(el.preset.value));
    el.forceModel.addEventListener('change', runSimulation);
    el.viewGeneral.addEventListener('click', () => alignView('general'));
    el.viewEquator.addEventListener('click', () => alignView('equator'));
    el.viewFront.addEventListener('click', () => alignView('front'));
    el.viewRight.addEventListener('click', () => alignView('right'));
    el.viewZoomIn.addEventListener('click', () => zoomView(0.72));
    el.viewZoomOut.addEventListener('click', () => zoomView(1.38));
    el.viewFollow.addEventListener('click', () => setFollowSatellite(!followSatellite));
    el.viewEcliptic.addEventListener('click', () => alignView('ecliptic'));
    el.viewOrbit.addEventListener('click', () => alignView('orbit'));
    renderer.domElement.addEventListener('dblclick', () => alignView('general'));
    for (const id of ['vx0', 'vy0', 'vz0']) {
      el[id].addEventListener('input', updateSpeedFromProjections);
    }
    el.alwaysVisible.addEventListener('change', updateDepthMode);
    for (const id of ['showEquatorPlane', 'showEclipticPlane', 'showAxes', 'showRadiusVector']) {
      el[id].addEventListener('change', updateLayerVisibility);
    }

    function initControls() {
      for (const name of Object.keys(presets)) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        el.preset.appendChild(option);
      }
      initRealtimeCatalogLibrary();

      setConfigFields({
        x0: DEFAULT_RADIUS,
        y0: 0,
        z0: 0,
        vx0: 0,
        vy0: DEFAULT_SPEED,
        vz0: 1,
        dt: 2,
        durationMin: 180
      });
      el.animationRate.value = 60;
      el.forceModel.value = 'twoBody';
      syncRealtimeQueryForGroup();
      updateSpeedFromProjections();
    }

    function initRealtimeCatalogLibrary() {
      refreshRealtimeSatelliteOptions(false);
    }

    function refreshRealtimeSatelliteOptions(preserveSelection = true) {
      const group = el.realtimeGroup.value || 'STATIONS';
      const previousId = el.realtimeSatellite.value;
      const groupSatellites = realtimeCatalogSatellites.filter(
        (satelliteData) => satelliteData.group === group
      );
      el.realtimeSatellite.replaceChildren();

      const manualOption = document.createElement('option');
      manualOption.value = 'custom';
      manualOption.textContent = 'Ручной ввод';
      el.realtimeSatellite.appendChild(manualOption);

      for (const satelliteData of groupSatellites) {
        const option = document.createElement('option');
        option.value = satelliteData.id;
        const catalogLabel = satelliteData.noradCatId
          ? `${satelliteData.label} / ${satelliteData.noradCatId}`
          : satelliteData.label;
        option.textContent = `${catalogLabel} / ${satelliteData.group}`;
        el.realtimeSatellite.appendChild(option);
      }

      if (preserveSelection && groupSatellites.some((satelliteData) => satelliteData.id === previousId)) {
        el.realtimeSatellite.value = previousId;
        applyRealtimeCatalogSelection();
        return;
      }

      const defaultQuery = defaultRealtimeQuery(group);
      const defaultSatellite = groupSatellites.find((satelliteData) => (
        normalizeRealtimeQuery(satelliteData.query || satelliteData.noradCatId)
          .includes(normalizeRealtimeQuery(defaultQuery))
      )) || groupSatellites[0] || null;

      if (defaultSatellite) {
        el.realtimeSatellite.value = defaultSatellite.id;
        applyRealtimeCatalogSelection();
      } else {
        el.realtimeSatellite.value = 'custom';
        syncRealtimeQueryForGroup();
      }
    }

    function selectedRealtimeCatalogSatellite() {
      const selectedId = el.realtimeSatellite.value;
      return realtimeCatalogSatellites.find((satelliteData) => satelliteData.id === selectedId) || null;
    }

    function applyRealtimeCatalogSelection() {
      const satelliteData = selectedRealtimeCatalogSatellite();
      if (!satelliteData) return;
      if (el.realtimeGroup.value !== satelliteData.group) {
        el.realtimeGroup.value = satelliteData.group;
        refreshRealtimeSatelliteOptions(false);
        return;
      }
      const query = satelliteData.query || satelliteData.noradCatId;
      el.realtimeQuery.value = query;
      lastRealtimeAutoQuery = query;
      const noradLabel = satelliteData.noradCatId ? ` / NORAD ${satelliteData.noradCatId}` : '';
      el.realtimeInfo.textContent = `${satelliteData.label}${noradLabel} / ${satelliteData.group}`;
    }

    function applyPreset(name) {
      el.preset.value = name;
      const preset = presets[name];
      if (!preset) {
        el['preset-info'].textContent = 'Ручной режим: можно менять координаты, скорости, шаг и длительность.';
        return;
      }

      setOrbitFields(preset);
      const state = orbitalElementsToState(preset);
      setConfigFields({
        x0: state[0],
        y0: state[1],
        z0: state[2],
        vx0: state[3],
        vy0: state[4],
        vz0: state[5],
        dt: preset.dt,
        durationMin: preset.durationMin
      });
      updateSpeedFromProjections();
      el['preset-info'].textContent = presetSummary(preset);
      runSimulation();
    }

    function setOrbitFields(values) {
      for (const key of ['semiMajorAxis', 'eccentricity', 'inclinationDeg', 'raanDeg', 'argPerigeeDeg', 'trueAnomalyDeg']) {
        el[key].value = formatNumber(values[key]);
      }
    }

    function setConfigFields(values) {
      for (const key of ['x0', 'y0', 'z0', 'vx0', 'vy0', 'vz0', 'dt', 'durationMin']) {
        el[key].value = formatNumber(values[key]);
      }
    }

    function applyOrbitParameters() {
      try {
        const state = orbitalElementsToState(readOrbitFields());
        setConfigFields({
          x0: state[0],
          y0: state[1],
          z0: state[2],
          vx0: state[3],
          vy0: state[4],
          vz0: state[5],
          dt: readNumber('dt'),
          durationMin: readNumber('durationMin')
        });
        updateSpeedFromProjections();
        el.preset.value = 'Пользовательская';
        el['preset-info'].textContent = 'Параметры орбиты применены: координаты и скорости пересчитаны.';
        runSimulation();
      } catch (error) {
        showError(error.message);
      }
    }

    function applySpeed() {
      try {
        const targetSpeed = readNumber('speed');
        if (targetSpeed < 0) throw new Error('Полная скорость V не может быть отрицательной.');

        const velocity = [readNumber('vx0'), readNumber('vy0'), readNumber('vz0')];
        const currentSpeed = norm(velocity);
        if (currentSpeed <= 1e-12) {
          throw new Error('Нельзя применить V: направление скорости нулевое. Сначала задайте Vx, Vy или Vz.');
        }

        const scale = targetSpeed / currentSpeed;
        el.vx0.value = formatNumber(velocity[0] * scale);
        el.vy0.value = formatNumber(velocity[1] * scale);
        el.vz0.value = formatNumber(velocity[2] * scale);
        el.preset.value = 'Пользовательская';
        el['preset-info'].textContent = 'Полная скорость V применена: проекции скорости масштабированы.';
        runSimulation();
      } catch (error) {
        showError(error.message);
      }
    }

    function runSimulation() {
      try {
        hideError();
        clearRealtimeRefreshTimer();
        const config = readConfig();
        const result = simulateOrbit(config);
        activeTrajectory = { type: 'model' };
        sampleUtcTimes = [];
        updateNoradPanel();
        history = result.history;
        times = result.times;
        speeds = history.map((state) => norm(state.slice(3, 6)));
        frameIndex = 0;
        simulationClock = 0;
        playing = true;
        updateSceneObjects(result.stoppedByCollision);
        updateSummary(result.stoppedByCollision);
        updateHud();
      } catch (error) {
        playing = false;
        showError(error.message);
      }
    }

    async function loadRealtimeTrajectory(options = {}) {
      const silent = Boolean(options.silent);
      const requestOverride = options.request || (silent ? activeTrajectory.request : null);
      const selectedLibrarySatellite = requestOverride?.catalogSatellite || selectedRealtimeCatalogSatellite();
      const group = requestOverride?.group || selectedLibrarySatellite?.group || el.realtimeGroup.value || 'STATIONS';
      const query = requestOverride?.query || (selectedLibrarySatellite
        ? selectedLibrarySatellite.query || selectedLibrarySatellite.noradCatId
        : el.realtimeQuery.value.trim() || defaultRealtimeQuery(group));
      const catnr = requestOverride?.catnr || (selectedLibrarySatellite ? selectedLibrarySatellite.noradCatId : '');
      const durationMin = clamp(readNumberOrDefault('durationMin', 180), 1, 1440);
      const stepSeconds = clamp(readNumberOrDefault('dt', 20), 1, 600);
      const params = new URLSearchParams({
        group,
        query,
        duration_min: String(durationMin),
        step_seconds: String(stepSeconds)
      });
      if (catnr) {
        params.set('catnr', catnr);
      }

      try {
        hideError();
        if (!silent) {
          el.loadRealtime.disabled = true;
          el.realtimeInfo.textContent = 'Загрузка CelesTrak GP/OMM...';
        }
        const response = await fetch(`/api/realtime/trajectory?${params.toString()}`);
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(realtimeErrorMessage(payload, response.status));
        }
        applyRealtimeTrajectory(payload, stepSeconds, {
          request: { group, query, catnr, catalogSatellite: selectedLibrarySatellite },
          preserveCamera: Boolean(options.preserveCamera),
          silent
        });
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        if (silent) {
          el.realtimeInfo.textContent = `Автообновление: ${message}`;
        } else {
          playing = false;
          el.realtimeInfo.textContent = `Ошибка: ${message}`;
          showError(message);
        }
      } finally {
        if (!silent) {
          el.loadRealtime.disabled = false;
        }
      }
    }

    function defaultRealtimeQuery(group) {
      return realtimeGroupDefaults[group] || realtimeGroupDefaults.STATIONS;
    }

    function normalizeRealtimeQuery(value) {
      return value.trim().toLowerCase();
    }

    function syncRealtimeQueryForGroup() {
      const group = el.realtimeGroup.value || 'STATIONS';
      const defaultQuery = defaultRealtimeQuery(group);
      const currentQuery = el.realtimeQuery.value.trim();
      if (
        !currentQuery ||
        normalizeRealtimeQuery(currentQuery) === normalizeRealtimeQuery(lastRealtimeAutoQuery)
      ) {
        el.realtimeQuery.value = defaultQuery;
        lastRealtimeAutoQuery = defaultQuery;
      }
      el.realtimeQuery.placeholder = `например: ${defaultQuery}`;
    }

    function realtimeErrorMessage(payload, status) {
      const baseMessage = payload.message || `HTTP ${status}`;
      if (!Array.isArray(payload.suggestions) || payload.suggestions.length === 0) {
        return baseMessage;
      }
      const names = payload.suggestions
        .map((item) => {
          const name = item && item.name ? String(item.name) : '';
          const norad = item && item.norad_cat_id ? String(item.norad_cat_id) : '';
          return name && norad ? `${name} / NORAD ${norad}` : name || norad;
        })
        .filter(Boolean);
      return names.length ? `${baseMessage} В группе есть: ${names.join(', ')}.` : baseMessage;
    }

    function applyRealtimeTrajectory(payload, stepSeconds, options = {}) {
      const samples = Array.isArray(payload.samples) ? payload.samples : [];
      if (!samples.length) {
        throw new Error('Источник не вернул сэмплы SGP4.');
      }

      const nextHistory = [];
      const nextTimes = [];
      const nextSampleUtcTimes = [];
      const firstUtcMs = Date.parse(samples[0].sample_utc);
      if (!Number.isFinite(firstUtcMs)) {
        throw new Error('Некорректное UTC-время в SGP4-ответе.');
      }

      for (const sample of samples) {
        const position = sample.visual_position_km;
        const velocity = sample.gcrs_velocity_km_s;
        const sampleUtcMs = Date.parse(sample.sample_utc);
        if (
          !Array.isArray(position) ||
          !Array.isArray(velocity) ||
          position.length !== 3 ||
          velocity.length !== 3 ||
          !Number.isFinite(sampleUtcMs)
        ) {
          throw new Error('Некорректный формат SGP4-сэмпла.');
        }
        nextHistory.push([
          Number(position[0]),
          Number(position[1]),
          Number(position[2]),
          Number(velocity[0]),
          Number(velocity[1]),
          Number(velocity[2])
        ]);
        nextSampleUtcTimes.push(sampleUtcMs);
        nextTimes.push((sampleUtcMs - firstUtcMs) / 1000);
      }

      activeTrajectory = {
        type: 'realtime',
        metadata: payload.metadata || {},
        satellite: payload.satellite || {},
        modelProfile: payload.model_profile || {},
        elementParameters: payload.element_parameters || {},
        request: options.request || null,
        catalogSatellite: options.request?.catalogSatellite || null,
        source: payload.source || '',
        fetchedAtUtc: payload.fetched_at_utc || null,
        refreshedAtUtc: new Date().toISOString(),
        samples
      };
      history = nextHistory;
      times = nextTimes;
      sampleUtcTimes = nextSampleUtcTimes;
      speeds = history.map((state) => norm(state.slice(3, 6)));
      frameIndex = nearestSampleIndex(Date.now());
      simulationClock = times[frameIndex] || 0;
      playing = true;
      el.dt.value = formatNumber(stepSeconds);
      el.preset.value = 'Пользовательская';
      el['preset-info'].textContent = 'Траектория получена из GP/OMM и распространена SGP4.';
      el.realtimeInfo.textContent = realtimeInfoText(payload, samples[frameIndex]);
      updateSceneObjects(false, { preserveCamera: Boolean(options.preserveCamera) });
      updateSummary(false);
      updateHud();
      scheduleRealtimeRefresh();
    }

    function resetToStart() {
      playing = false;
      frameIndex = 0;
      simulationClock = 0;
      updateTrail();
      updateSatellite();
      updateHud();
    }

    function scheduleRealtimeRefresh() {
      clearRealtimeRefreshTimer();
      realtimeRefreshTimer = window.setInterval(() => {
        if (activeTrajectory.type === 'realtime') {
          loadRealtimeTrajectory({
            silent: true,
            preserveCamera: true,
            request: activeTrajectory.request
          });
        }
      }, REALTIME_REFRESH_MS);
    }

    function clearRealtimeRefreshTimer() {
      if (realtimeRefreshTimer !== null) {
        window.clearInterval(realtimeRefreshTimer);
        realtimeRefreshTimer = null;
      }
    }

    function updateSceneObjects(stoppedByCollision, options = {}) {
      renderStride = Math.max(1, Math.ceil(history.length / MAX_RENDER_POINTS));
      renderPositions = makeRenderPositions(history, renderStride);

      setLinePoints(orbitLine, renderPositions);
      setLinePoints(orbitLineVisible, renderPositions);
      setLinePoints(trailLine, renderPositions);
      updateDepthMode();
      updateReferencePlanes(renderPositions);
      updateLayerVisibility();
      updateTrail();
      updateSatellite();
      if (!options.preserveCamera) {
        fitCameraToTrajectory(renderPositions);
      }
      if (stoppedByCollision) {
        showError('Расчет остановлен: пересечение поверхности Земли.');
      }
    }

    function updateDepthMode() {
      const alwaysVisible = el.alwaysVisible.checked;
      orbitLine.visible = !alwaysVisible;
      orbitLine.material.depthTest = false;
      orbitLine.material.depthWrite = false;
      orbitLine.material.transparent = true;
      orbitLine.material.opacity = 0.12;
      orbitLine.renderOrder = 4;

      for (const line of [orbitLineVisible, trailLine, positionVectorLine]) {
        line.material.depthTest = !alwaysVisible;
        line.material.depthWrite = false;
        line.material.transparent = true;
        line.renderOrder = alwaysVisible ? 8 : 5;
      }
      orbitLineVisible.material.opacity = alwaysVisible ? 0.74 : 0.62;
      trailLine.material.opacity = alwaysVisible ? 1.0 : 0.95;
      positionVectorLine.material.opacity = alwaysVisible ? 0.68 : 0.48;
      satellite.material.depthTest = !alwaysVisible;
      satellite.renderOrder = alwaysVisible ? 14 : 0;
    }

    function updateReferencePlanes(points) {
      const maxRadius = points.reduce((maxValue, point) => Math.max(maxValue, point.length()), R_EARTH);
      const planeRadius = Math.max(R_EARTH * 1.28, Math.min(maxRadius * 0.62, R_EARTH * 2.2));
      equatorPlane.scale.setScalar(planeRadius);
      eclipticPlane.scale.setScalar(planeRadius);
    }

    function updateLayerVisibility() {
      equatorPlane.visible = el.showEquatorPlane.checked;
      eclipticPlane.visible = el.showEclipticPlane.checked;
      equatorGreatCircle.visible = el.showEquatorPlane.checked;
      eclipticGreatCircle.visible = el.showEclipticPlane.checked;
      earthAxes.group.visible = el.showAxes.checked;
      positionVectorLine.visible = el.showRadiusVector.checked;
    }

    function updateTrail() {
      if (!history.length || !renderPositions.length) return;
      const range = trailDrawRange();
      trailLine.geometry.setDrawRange(range.start, range.count);
    }

    function updateSatellite() {
      if (!history.length) return;
      const state = history[frameIndex];
      const position = new THREE.Vector3(state[0], state[1], state[2]);
      satellite.position.copy(position);
      setPositionVectorLine(position);
      updateSatelliteMarkerScale();
      updateFollowTarget();
    }

    function updateHud() {
      if (!history.length) {
        updateNoradPanel();
        return;
      }
      const altitude = norm(history[frameIndex].slice(0, 3)) - R_EARTH;
      const timeLabel = activeTrajectory.type === 'realtime' && sampleUtcTimes[frameIndex]
        ? `UTC = ${formatUtc(sampleUtcTimes[frameIndex])}`
        : `t = ${(times[frameIndex] / 60).toFixed(1)} мин`;
      el.hud.innerHTML = `${timeLabel}<br>h = ${altitude.toFixed(1)} км<br>V = ${speeds[frameIndex].toFixed(3)} км/с`;
      updateNoradPanel();
    }

    function updateNoradPanel() {
      if (activeTrajectory.type !== 'realtime') {
        el.noradPanel.textContent = '';
        el.noradPanel.style.display = 'none';
        return;
      }

      const parameters = activeTrajectory.elementParameters || {};
      const sample = activeTrajectory.samples?.[frameIndex] || activeTrajectory.samples?.[0] || {};
      const satelliteData = activeTrajectory.satellite || {};
      const lines = [
        'NORAD / OMM',
        `${satelliteData.name || parameters.object_name || 'Спутник'} / ${parameters.norad_cat_id || satelliteData.norad_cat_id || '-'}`,
        `COSPAR: ${parameters.object_id || '-'}`,
        `Epoch: ${formatUtc(parameters.epoch_utc || satelliteData.epoch_utc)}`,
        `Frame: ${parameters.ref_frame || '-'}  Time: ${parameters.time_system || '-'}`,
        `n: ${formatMetric(parameters.mean_motion_rev_per_day, 8)} rev/day`,
        `T: ${formatMetric(parameters.period_min, 2)} мин`,
        `e: ${formatMetric(parameters.eccentricity, 7)}`,
        `i/Omega: ${formatMetric(parameters.inclination_deg, 3)} / ${formatMetric(parameters.raan_deg, 3)} deg`,
        `omega/M: ${formatMetric(parameters.arg_perigee_deg, 3)} / ${formatMetric(parameters.mean_anomaly_deg, 3)} deg`,
        `BSTAR: ${formatMetric(parameters.bstar, 3)}`,
        `rev: ${parameters.rev_at_epoch || '-'}  set: ${parameters.element_set_no || '-'}`,
        `lat/lon: ${formatMetric(sample.latitude_deg, 2)} / ${formatMetric(sample.longitude_deg, 2)} deg`
      ];
      el.noradPanel.textContent = lines.join('\n');
      el.noradPanel.style.display = 'block';
    }

    function updateSummary(stoppedByCollision) {
      if (activeTrajectory.type === 'realtime') {
        updateRealtimeSummary();
        return;
      }

      const state = history[0];
      const position = state.slice(0, 3);
      const velocity = state.slice(3, 6);
      const radius = norm(position);
      const speed = norm(velocity);
      const altitude = radius - R_EARTH;
      const energy = speed ** 2 / 2 - MU / radius;
      const angularMomentum = cross(position, velocity);
      const hNorm = norm(angularMomentum);
      const dotRV = dot(position, velocity);
      const eVector = position.map((p, i) => ((speed ** 2 - MU / radius) * p - dotRV * velocity[i]) / MU);
      const eccentricity = norm(eVector);

      const lines = [
        `Frame: ${REFERENCE_FRAME}`,
        `Time scale: ${TIME_SCALE}`,
        `Units: ${UNITS}`,
        `Force model: ${forceModelLabels[readForceModel()]}`,
        `Earth home: ${EARTH_HOME_POINT}`,
        '',
        `Высота старта: ${altitude.toFixed(1)} км`,
        `Скорость старта: ${speed.toFixed(3)} км/с`,
        `Эксцентриситет: ${eccentricity.toFixed(4)}`
      ];

      if (energy < 0) {
        const semiMajorAxis = -MU / (2 * energy);
        const periodMin = 2 * Math.PI * Math.sqrt(semiMajorAxis ** 3 / MU) / 60;
        lines.push(`Большая полуось: ${semiMajorAxis.toFixed(1)} км`);
        lines.push(`Период: ${periodMin.toFixed(1)} мин`);
      } else {
        lines.push('Орбита: незамкнутая');
      }

      if (hNorm > 1e-9) {
        const inclination = Math.acos(clamp(angularMomentum[2] / hNorm, -1, 1)) * 180 / Math.PI;
        lines.push(`Наклонение: ${inclination.toFixed(2)} град`);
      } else {
        lines.push('Наклонение: не определено');
      }

      if (stoppedByCollision) {
        lines.push('Расчет остановлен: пересечение поверхности Земли.');
      }

      el.summary.textContent = lines.join('\n');
    }

    function animate(timestamp) {
      requestAnimationFrame(animate);
      const deltaMs = lastTimestamp ? timestamp - lastTimestamp : 0;
      lastTimestamp = timestamp;
      controls.update();
      updateSatelliteMarkerScale();
      updateAxisMarkerScale();
      updateViewCompass();

      if (playing && history.length > 1) {
        const nextIndex = activeTrajectory.type === 'realtime' && sampleUtcTimes.length
          ? nearestSampleIndex(Date.now())
          : nextModelFrameIndex(deltaMs);
        if (nextIndex !== frameIndex) {
          frameIndex = nextIndex;
          updateTrail();
          updateSatellite();
          updateHud();
        }
      }

      renderer.render(scene, camera);
    }

    function nextModelFrameIndex(deltaMs) {
      const animationRate = Math.max(0.1, readNumberOrDefault('animationRate', 60));
      simulationClock += (deltaMs / 1000) * animationRate;
      const dt = Math.max(1e-9, readNumberOrDefault('dt', 1));
      return Math.floor(simulationClock / dt) % history.length;
    }

    function nearestSampleIndex(targetUtcMs) {
      if (!sampleUtcTimes.length) return 0;
      if (targetUtcMs <= sampleUtcTimes[0]) return 0;
      const lastIndex = sampleUtcTimes.length - 1;
      if (targetUtcMs >= sampleUtcTimes[lastIndex]) return lastIndex;

      let low = 0;
      let high = lastIndex;
      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        if (sampleUtcTimes[mid] < targetUtcMs) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      const before = Math.max(0, low - 1);
      const after = Math.min(lastIndex, low);
      return targetUtcMs - sampleUtcTimes[before] <= sampleUtcTimes[after] - targetUtcMs
        ? before
        : after;
    }

    function updateRealtimeSummary() {
      const metadata = activeTrajectory.metadata || {};
      const modelProfile = activeTrajectory.modelProfile || {};
      const satelliteData = activeTrajectory.satellite || {};
      const catalogSatellite = activeTrajectory.catalogSatellite || {};
      const parameters = activeTrajectory.elementParameters || {};
      const sample = activeTrajectory.samples?.[frameIndex] || activeTrajectory.samples?.[0] || {};
      const stale = sample.epoch_is_stale ? ' (устарела)' : '';
      const lines = [
        `Frame: ${metadata.frame || 'SGP4/Skyfield GCRS + WGS84 visual position.'}`,
        `Time scale: ${metadata.time_scale || 'UTC wall-clock time.'}`,
        `Units: ${metadata.units || 'km, km/s, degrees.'}`,
        `Force model: ${metadata.force_model || 'SGP4 general perturbations.'}`,
        `Input: ${modelProfile.input_frame || parameters.ref_frame || 'TEME'} / ${modelProfile.input_time_system || parameters.time_system || 'UTC'} / ${modelProfile.mean_element_theory || parameters.mean_element_theory || 'SGP4'}`,
        `Earth home: ${EARTH_HOME_POINT}`,
        '',
        `Спутник: ${satelliteData.name || 'не указан'} / NORAD ${satelliteData.norad_cat_id || '-'}`,
        `Каталог: ${catalogSatellite.label || 'ручной поиск'}`,
        `Эпоха OMM: ${formatUtc(satelliteData.epoch_utc)}`,
        `Возраст эпохи: ${Number(sample.epoch_age_days || 0).toFixed(2)} суток${stale}`,
        `OMM n/e/i: ${formatMetric(parameters.mean_motion_rev_per_day, 8)} rev/day, ${formatMetric(parameters.eccentricity, 7)}, ${formatMetric(parameters.inclination_deg, 3)} deg`,
        `OMM Omega/omega/M: ${formatMetric(parameters.raan_deg, 3)} / ${formatMetric(parameters.arg_perigee_deg, 3)} / ${formatMetric(parameters.mean_anomaly_deg, 3)} deg`,
        `OMM BSTAR: ${formatMetric(parameters.bstar, 3)}`,
        `Обновлено: ${formatUtc(activeTrajectory.refreshedAtUtc)}`,
        `Сэмплы: ${history.length}`,
        `Источник: ${activeTrajectory.source || 'CelesTrak GP/OMM'}`
      ];
      el.summary.textContent = lines.join('\n');
    }

    function readConfig() {
      const config = {
        x0: readNumber('x0'),
        y0: readNumber('y0'),
        z0: readNumber('z0'),
        vx0: readNumber('vx0'),
        vy0: readNumber('vy0'),
        vz0: readNumber('vz0'),
        dt: readNumber('dt'),
        durationMin: readNumber('durationMin'),
        forceModel: readForceModel()
      };
      if (config.dt <= 0) throw new Error('Шаг dt должен быть больше нуля.');
      if (config.durationMin <= 0) throw new Error('Длительность расчета должна быть больше нуля.');
      if (norm([config.x0, config.y0, config.z0]) <= R_EARTH) {
        throw new Error(`Начальная точка находится внутри Земли. Радиус должен быть больше ${R_EARTH.toFixed(0)} км.`);
      }
      return config;
    }

    function readForceModel() {
      return el.forceModel.value === 'j2' ? 'j2' : 'twoBody';
    }

    function readOrbitFields() {
      return {
        semiMajorAxis: readNumber('semiMajorAxis'),
        eccentricity: readNumber('eccentricity'),
        inclinationDeg: readNumber('inclinationDeg'),
        raanDeg: readNumber('raanDeg'),
        argPerigeeDeg: readNumber('argPerigeeDeg'),
        trueAnomalyDeg: readNumber('trueAnomalyDeg')
      };
    }

    function readNumber(id) {
      const value = Number(String(el[id].value).replace(',', '.'));
      if (!Number.isFinite(value)) throw new Error(`Поле ${id}: введите число.`);
      return value;
    }

    function readNumberOrDefault(id, fallback) {
      const value = Number(String(el[id].value).replace(',', '.'));
      return Number.isFinite(value) ? value : fallback;
    }

    function updateSpeedFromProjections() {
      const velocity = ['vx0', 'vy0', 'vz0'].map((id) => Number(String(el[id].value).replace(',', '.')));
      if (velocity.every(Number.isFinite)) {
        el.speed.value = formatNumber(norm(velocity));
      }
    }

    function simulateOrbit(config) {
      const steps = Math.ceil(config.durationMin * 60 / config.dt);
      if (steps > MAX_STEPS) {
        throw new Error(`Слишком много шагов расчета: ${steps}. Увеличьте dt или уменьшите длительность.`);
      }

      const localHistory = [];
      const localTimes = [];
      let state = [config.x0, config.y0, config.z0, config.vx0, config.vy0, config.vz0];
      let stoppedByCollision = false;
      localHistory.push(state.slice());
      localTimes.push(0);

      for (let index = 1; index <= steps; index += 1) {
        state = rk4Step(state, config.dt, config.forceModel);
        localHistory.push(state.slice());
        localTimes.push(index * config.dt);
        if (norm(state.slice(0, 3)) <= R_EARTH) {
          stoppedByCollision = true;
          break;
        }
      }

      return { history: localHistory, times: localTimes, stoppedByCollision };
    }

    function deriv(state, forceModel) {
      const [x, y, z, vx, vy, vz] = state;
      const radius = Math.sqrt(x * x + y * y + z * z);
      if (radius <= 0) throw new Error('Радиус-вектор не может быть нулевым.');
      const centralFactor = -MU / radius ** 3;
      const acceleration = [centralFactor * x, centralFactor * y, centralFactor * z];

      if (forceModel === 'j2') {
        const radius2 = radius * radius;
        const z2Ratio = z * z / radius2;
        const factor = 1.5 * J2 * MU * J2_REFERENCE_RADIUS ** 2 / radius ** 5;
        acceleration[0] += factor * x * (5 * z2Ratio - 1);
        acceleration[1] += factor * y * (5 * z2Ratio - 1);
        acceleration[2] += factor * z * (5 * z2Ratio - 3);
      }

      return [vx, vy, vz, acceleration[0], acceleration[1], acceleration[2]];
    }

    function rk4Step(state, dt, forceModel) {
      const k1 = deriv(state, forceModel);
      const k2 = deriv(state.map((v, i) => v + 0.5 * dt * k1[i]), forceModel);
      const k3 = deriv(state.map((v, i) => v + 0.5 * dt * k2[i]), forceModel);
      const k4 = deriv(state.map((v, i) => v + dt * k3[i]), forceModel);
      return state.map((v, i) => v + (dt / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
    }

    function orbitalElementsToState(elements) {
      const a = elements.semiMajorAxis;
      const e = elements.eccentricity;
      if (a <= R_EARTH) throw new Error('Большая полуось должна быть больше радиуса Земли.');
      if (e < 0 || e >= 1) throw new Error('Эксцентриситет должен быть в диапазоне [0, 1).');
      if (a * (1 - e) <= R_EARTH) throw new Error('Перигей орбиты находится внутри Земли. Уменьшите e или увеличьте a.');

      const p = a * (1 - e * e);
      const nu = degToRad(elements.trueAnomalyDeg);
      const radius = p / (1 + e * Math.cos(nu));
      const posOrb = [radius * Math.cos(nu), radius * Math.sin(nu), 0];
      const velFactor = Math.sqrt(MU / p);
      const velOrb = [-Math.sin(nu) * velFactor, (e + Math.cos(nu)) * velFactor, 0];
      const rotation = multiplyMatrices(
        multiplyMatrices(rotationZ(elements.raanDeg), rotationX(elements.inclinationDeg)),
        rotationZ(elements.argPerigeeDeg)
      );
      return [...multiplyMatrixVector(rotation, posOrb), ...multiplyMatrixVector(rotation, velOrb)];
    }

    function presetSummary(preset) {
      const perigeeAlt = preset.semiMajorAxis * (1 - preset.eccentricity) - R_EARTH;
      const apogeeAlt = preset.semiMajorAxis * (1 + preset.eccentricity) - R_EARTH;
      return `${preset.description}
a = ${preset.semiMajorAxis.toFixed(1)} км, e = ${preset.eccentricity.toFixed(4)}
i = ${preset.inclinationDeg.toFixed(2)} град, высота = ${perigeeAlt.toFixed(0)}-${apogeeAlt.toFixed(0)} км
dt = ${formatCompact(preset.dt)} с, расчет = ${formatCompact(preset.durationMin)} мин`;
    }

    function makeLine(color, opacity, depthTest) {
      const line = new THREE.Line(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({
          color,
          transparent: opacity < 1,
          opacity,
          depthTest,
          depthWrite: depthTest
        })
      );
      line.frustumCulled = false;
      return line;
    }

    function makeReferencePlane(color, opacity) {
      const group = new THREE.Group();
      const fill = new THREE.Mesh(
        new THREE.CircleGeometry(1, 192),
        new THREE.MeshBasicMaterial({
          color,
          opacity,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );
      const rim = new THREE.Line(
        circleGeometry(1, 192, 'xy'),
        new THREE.LineBasicMaterial({
          color,
          transparent: true,
          opacity: Math.min(0.5, opacity * 6),
          depthWrite: false
        })
      );
      fill.renderOrder = 2;
      rim.renderOrder = 3;
      group.add(fill, rim);
      return group;
    }

    function makeAtmosphere() {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(R_EARTH * 1.018, 128, 64),
        new THREE.MeshBasicMaterial({
          color: 0x7dd3fc,
          transparent: true,
          opacity: 0.09,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide,
          depthWrite: false
        })
      );
      mesh.renderOrder = 1;
      return mesh;
    }

    function makeEarthGraticule() {
      const group = new THREE.Group();
      const radius = R_EARTH * 1.0035;
      const material = new THREE.LineBasicMaterial({
        color: 0xbfe9ff,
        transparent: true,
        opacity: 0.24,
        depthTest: true,
        depthWrite: false
      });

      for (let latitude = -60; latitude <= 60; latitude += 30) {
        group.add(new THREE.Line(graticuleLatitudeGeometry(radius, latitude), material.clone()));
      }

      for (let longitude = 0; longitude < 360; longitude += 30) {
        group.add(new THREE.Line(graticuleLongitudeGeometry(radius, longitude), material.clone()));
      }

      group.renderOrder = 6;
      return group;
    }

    function graticuleLatitudeGeometry(radius, latitudeDeg) {
      const points = [];
      const latitude = degToRad(latitudeDeg);
      const z = radius * Math.sin(latitude);
      const ringRadius = radius * Math.cos(latitude);
      for (let step = 0; step <= 192; step += 1) {
        const longitude = step / 192 * Math.PI * 2;
        points.push(new THREE.Vector3(
          ringRadius * Math.cos(longitude),
          ringRadius * Math.sin(longitude),
          z
        ));
      }
      return new THREE.BufferGeometry().setFromPoints(points);
    }

    function graticuleLongitudeGeometry(radius, longitudeDeg) {
      const points = [];
      const longitude = degToRad(longitudeDeg);
      for (let step = -96; step <= 96; step += 1) {
        const latitude = step / 96 * Math.PI / 2;
        const ringRadius = radius * Math.cos(latitude);
        points.push(new THREE.Vector3(
          ringRadius * Math.cos(longitude),
          ringRadius * Math.sin(longitude),
          radius * Math.sin(latitude)
        ));
      }
      return new THREE.BufferGeometry().setFromPoints(points);
    }

    function earthSurfacePoint(latitudeDeg, longitudeDeg, radius = R_EARTH) {
      const latitude = degToRad(latitudeDeg);
      const longitude = degToRad(longitudeDeg);
      const ringRadius = radius * Math.cos(latitude);
      return new THREE.Vector3(
        ringRadius * Math.cos(longitude),
        ringRadius * Math.sin(longitude),
        radius * Math.sin(latitude)
      );
    }

    function earthSurfaceNorth(latitudeDeg, longitudeDeg) {
      const latitude = degToRad(latitudeDeg);
      const longitude = degToRad(longitudeDeg);
      return new THREE.Vector3(
        -Math.sin(latitude) * Math.cos(longitude),
        -Math.sin(latitude) * Math.sin(longitude),
        Math.cos(latitude)
      ).normalize();
    }

    function moscowHomeDirection() {
      return earthSurfacePoint(
        MOSCOW_HOME.latitudeDeg,
        MOSCOW_HOME.longitudeDeg,
        1
      ).normalize();
    }

    function moscowHomeUp() {
      return earthSurfaceNorth(MOSCOW_HOME.latitudeDeg, MOSCOW_HOME.longitudeDeg);
    }

    function makeGroundMarker(label, latitudeDeg, longitudeDeg) {
      const group = new THREE.Group();
      const surfacePosition = earthSurfacePoint(latitudeDeg, longitudeDeg, R_EARTH * 1.006);
      const normal = surfacePosition.clone().normalize();
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(R_EARTH * 0.012, R_EARTH * 0.032, 64),
        new THREE.MeshBasicMaterial({
          color: 0xfff7ed,
          transparent: true,
          opacity: 0.94,
          side: THREE.DoubleSide,
          depthTest: false,
          depthWrite: false,
          toneMapped: false
        })
      );
      ring.position.copy(surfacePosition);
      ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
      ring.renderOrder = 13;

      const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeGroundLabelTexture(label),
        transparent: true,
        depthTest: false,
        depthWrite: false,
        toneMapped: false
      }));
      labelSprite.position.copy(earthSurfacePoint(latitudeDeg, longitudeDeg, R_EARTH * 1.16));
      labelSprite.renderOrder = 15;

      group.add(ring, labelSprite);
      return { group, label: labelSprite };
    }

    function makeEarthAxes() {
      const group = new THREE.Group();
      const labels = [];
      const origin = new THREE.Vector3(0, 0, 0);
      const axisLength = R_EARTH * 1.08;
      const axisHeadLength = R_EARTH * 0.065;
      const axisHeadWidth = R_EARTH * 0.04;
      const labelOffset = R_EARTH * 0.055;
      const axes = [
        { label: 'X', color: 0xf87171, direction: new THREE.Vector3(1, 0, 0) },
        { label: 'Y', color: 0x4ade80, direction: new THREE.Vector3(0, 1, 0) },
        { label: 'Z', color: 0x818cf8, direction: new THREE.Vector3(0, 0, 1) }
      ];

      for (const axis of axes) {
        const arrow = new THREE.ArrowHelper(
          axis.direction,
          origin,
          axisLength,
          axis.color,
          axisHeadLength,
          axisHeadWidth
        );
        prepareAxisMaterial(arrow.line.material, 0.72);
        prepareAxisMaterial(arrow.cone.material, 0.84);
        arrow.line.renderOrder = 9;
        arrow.cone.renderOrder = 10;
        group.add(arrow);

        const label = new THREE.Sprite(new THREE.SpriteMaterial({
          map: makeAxisLabelTexture(axis.label, axis.color),
          transparent: true,
          depthTest: false,
          depthWrite: false,
          toneMapped: false
        }));
        label.position.copy(axis.direction.clone().multiplyScalar(axisLength + labelOffset));
        label.renderOrder = 12;
        labels.push(label);
        group.add(label);
      }

      const center = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeAxisLabelTexture('O', 0xffffff, true),
        transparent: true,
        depthTest: false,
        depthWrite: false,
        toneMapped: false
      }));
      center.renderOrder = 11;
      group.add(center);

      return { group, labels, center };
    }

    function prepareAxisMaterial(material, opacity) {
      material.transparent = true;
      material.opacity = opacity;
      material.depthTest = false;
      material.depthWrite = false;
      material.toneMapped = false;
    }

    function makeAxisLabelTexture(text, color, isCenter = false) {
      const size = 128;
      const center = size / 2;
      const radius = isCenter ? 28 : 42;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      const colorStyle = new THREE.Color(color).getStyle();

      context.clearRect(0, 0, size, size);
      context.shadowColor = 'rgba(0, 0, 0, 0.5)';
      context.shadowBlur = isCenter ? 6 : 12;
      context.beginPath();
      context.arc(center, center, radius + 7, 0, Math.PI * 2);
      context.fillStyle = 'rgba(3, 7, 18, 0.78)';
      context.fill();

      context.shadowBlur = 0;
      context.beginPath();
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.fillStyle = isCenter ? 'rgba(248, 250, 252, 0.9)' : colorStyle;
      context.fill();

      context.lineWidth = isCenter ? 5 : 7;
      context.strokeStyle = isCenter ? 'rgba(15, 23, 42, 0.95)' : 'rgba(248, 250, 252, 0.92)';
      context.stroke();

      context.fillStyle = isCenter ? '#0f172a' : '#06111f';
      context.font = `${isCenter ? 36 : 50}px Arial, sans-serif`;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(text, center, center + (isCenter ? 1 : 2));

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    function makeSatelliteMarkerTexture() {
      const size = 128;
      const center = size / 2;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');

      context.clearRect(0, 0, size, size);
      context.beginPath();
      context.arc(center, center, 58, 0, Math.PI * 2);
      context.fillStyle = 'rgba(3, 7, 18, 0.96)';
      context.fill();

      context.beginPath();
      context.arc(center, center, 47, 0, Math.PI * 2);
      context.fillStyle = '#ffffff';
      context.fill();

      context.beginPath();
      context.arc(center, center, 31, 0, Math.PI * 2);
      context.fillStyle = '#ffe600';
      context.fill();

      context.lineWidth = 7;
      context.strokeStyle = '#111827';
      context.beginPath();
      context.arc(center, center, 31, 0, Math.PI * 2);
      context.stroke();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeGroundLabelTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 96;
      const context = canvas.getContext('2d');

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.shadowColor = 'rgba(0, 0, 0, 0.55)';
      context.shadowBlur = 12;
      context.fillStyle = 'rgba(3, 7, 18, 0.82)';
      roundRect(context, 16, 18, 224, 58, 24);
      context.fill();
      context.shadowBlur = 0;
      context.strokeStyle = 'rgba(255, 247, 237, 0.92)';
      context.lineWidth = 4;
      roundRect(context, 16, 18, 224, 58, 24);
      context.stroke();
      context.fillStyle = '#fff7ed';
      context.font = 'bold 34px "Segoe UI", Arial, sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(text, canvas.width / 2, 47);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    function roundRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();
    }

    function updateSatelliteMarkerScale() {
      if (!history.length) return;
      const distance = camera.position.distanceTo(satellite.position);
      const canvasHeight = Math.max(1, renderer.domElement.clientHeight);
      const fovRadians = THREE.MathUtils.degToRad(camera.fov);
      const worldUnitsPerPixel = 2 * distance * Math.tan(fovRadians / 2) / canvasHeight;
      const markerSize = clamp(worldUnitsPerPixel * 30, 420, 3600);
      satellite.scale.set(markerSize, markerSize, 1);
    }

    function updateAxisMarkerScale() {
      const canvasHeight = Math.max(1, renderer.domElement.clientHeight);
      const fovRadians = THREE.MathUtils.degToRad(camera.fov);
      for (const sprite of axisLabelSprites) {
        const distance = camera.position.distanceTo(sprite.position);
        const worldUnitsPerPixel = 2 * distance * Math.tan(fovRadians / 2) / canvasHeight;
        const markerSize = clamp(worldUnitsPerPixel * 24, 260, 2600);
        sprite.scale.set(markerSize, markerSize, 1);
      }
      const centerDistance = camera.position.distanceTo(axisCenterSprite.position);
      const centerUnitsPerPixel = 2 * centerDistance * Math.tan(fovRadians / 2) / canvasHeight;
      const centerSize = clamp(centerUnitsPerPixel * 18, 180, 1900);
      axisCenterSprite.scale.set(centerSize, centerSize, 1);

      const labelDistance = camera.position.distanceTo(moscowHomeMarker.label.position);
      const labelUnitsPerPixel = 2 * labelDistance * Math.tan(fovRadians / 2) / canvasHeight;
      const labelHeight = clamp(labelUnitsPerPixel * 28, 320, 1700);
      moscowHomeMarker.label.scale.set(labelHeight * 2.65, labelHeight, 1);
    }

    function setPositionVectorLine(position) {
      const positions = positionVectorLine.geometry.getAttribute('position');
      if (!positions) {
        positionVectorLine.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
        positionVectorLine.geometry.setDrawRange(0, 2);
      }
      const array = positionVectorLine.geometry.getAttribute('position').array;
      array[0] = 0;
      array[1] = 0;
      array[2] = 0;
      array[3] = position.x;
      array[4] = position.y;
      array[5] = position.z;
      positionVectorLine.geometry.getAttribute('position').needsUpdate = true;
      positionVectorLine.geometry.computeBoundingSphere();
    }

    function setLinePoints(line, points) {
      const positions = new Float32Array(points.length * 3);
      for (let index = 0; index < points.length; index += 1) {
        const point = points[index];
        const offset = index * 3;
        positions[offset] = point.x;
        positions[offset + 1] = point.y;
        positions[offset + 2] = point.z;
      }

      line.geometry.dispose();
      line.geometry = new THREE.BufferGeometry();
      line.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      line.geometry.setDrawRange(0, points.length);
      line.geometry.computeBoundingSphere();
    }

    function makeRenderPositions(states, stride) {
      const positions = [];
      for (let index = 0; index < states.length; index += stride) {
        const state = states[index];
        positions.push(new THREE.Vector3(state[0], state[1], state[2]));
      }

      const lastState = states[states.length - 1];
      const lastPosition = positions[positions.length - 1];
      if (
        lastState &&
        (!lastPosition ||
          lastPosition.x !== lastState[0] ||
          lastPosition.y !== lastState[1] ||
          lastPosition.z !== lastState[2])
      ) {
        positions.push(new THREE.Vector3(lastState[0], lastState[1], lastState[2]));
      }

      return positions;
    }

    function trailDrawRange() {
      const current = currentRenderPointIndex();
      const dt = Math.max(1e-9, readNumberOrDefault('dt', 1));
      const trailSamples = Math.max(1, Math.ceil(TRAIL_WINDOW_MIN * 60 / dt / renderStride));
      const start = Math.max(0, current - trailSamples);
      return { start, count: Math.max(1, current - start + 1) };
    }

    function currentRenderPointIndex() {
      if (frameIndex >= history.length - 1) {
        return Math.max(0, renderPositions.length - 1);
      }
      return Math.min(renderPositions.length - 1, Math.max(0, Math.floor(frameIndex / renderStride)));
    }

    function circleGeometry(radius, segments, plane) {
      const points = [];
      for (let i = 0; i <= segments; i += 1) {
        const angle = i / segments * Math.PI * 2;
        if (plane === 'xy') {
          points.push(new THREE.Vector3(radius * Math.cos(angle), radius * Math.sin(angle), 0));
        }
      }
      return new THREE.BufferGeometry().setFromPoints(points);
    }

    function fitCameraToTrajectory(points) {
      if (!points.length) return;
      const maxRadius = points.reduce((maxValue, point) => Math.max(maxValue, point.length()), R_EARTH);
      const fovRadians = THREE.MathUtils.degToRad(camera.fov);
      viewDistance = Math.max(R_EARTH * 3.0, maxRadius / Math.sin(fovRadians / 2) * 1.08);
      camera.near = Math.max(1, viewDistance / 12000);
      camera.far = viewDistance * 10;
      camera.updateProjectionMatrix();
      updateControlLimits(maxRadius);
      controls.target.copy(followSatellite ? satellite.position : new THREE.Vector3(0, 0, 0));
      if (!controls.userData?.userMoved) {
        const target = controls.target.clone();
        const direction = followSatellite
          ? new THREE.Vector3(0.62, -0.74, 0.48).normalize()
          : moscowHomeDirection();
        const up = followSatellite ? new THREE.Vector3(0, 0, 1) : moscowHomeUp();
        camera.position.copy(target).add(direction.clone().multiplyScalar(viewDistance));
        camera.up.copy(safeCameraUp(direction, up));
        camera.lookAt(target);
      }
      updateControlsFromCode();
    }

    function updateControlLimits(maxRadius) {
      controls.cursor.set(0, 0, 0);
      controls.minDistance = followSatellite ? Math.max(350, R_EARTH * 0.08) : R_EARTH * 1.08;
      controls.maxDistance = Math.max(viewDistance * 4.5, maxRadius * 3.0, R_EARTH * 8);
      controls.maxTargetRadius = followSatellite ? Infinity : Math.max(R_EARTH * 0.35, maxRadius * 0.32);
    }

    controls.addEventListener('change', () => {
      if (!syncingCamera) {
        controls.userData = { userMoved: true };
        setActiveView(null);
      }
    });

    function alignView(mode) {
      if (followSatellite) {
        setFollowSatellite(false);
      }
      setActiveView(mode);
      if (mode === 'general') {
        controls.userData = { userMoved: false };
        fitCameraToTrajectory(renderPositions);
        return;
      }
      if (mode === 'equator') {
        setCameraView(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 1, 0));
        return;
      }
      if (mode === 'front') {
        setCameraView(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 0, 1));
        return;
      }
      if (mode === 'right') {
        setCameraView(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 1));
        return;
      }
      if (mode === 'ecliptic') {
        const eps = degToRad(EARTH_OBLIQUITY_DEG);
        setCameraView(
          new THREE.Vector3(0, -Math.sin(eps), Math.cos(eps)),
          new THREE.Vector3(0, Math.cos(eps), Math.sin(eps))
        );
        return;
      }
      if (mode === 'orbit') {
        const normal = currentOrbitNormal();
        setCameraView(normal, new THREE.Vector3(0, 0, 1));
      }
    }

    function setActiveView(mode) {
      const activeByMode = {
        general: el.viewGeneral,
        equator: el.viewEquator,
        front: el.viewFront,
        right: el.viewRight,
        ecliptic: el.viewEcliptic,
        orbit: el.viewOrbit
      };
      for (const button of Object.values(activeByMode)) {
        button.classList.remove('active');
      }
      if (mode) {
        activeByMode[mode]?.classList.add('active');
      }
    }

    function setCameraView(direction, up) {
      const viewDirection = direction.clone().normalize();
      const distance = Math.max(viewDistance, R_EARTH * 2.8);
      camera.position.copy(viewDirection.multiplyScalar(distance));
      camera.up.copy(safeCameraUp(direction, up));
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.userData = { userMoved: true };
      updateControlsFromCode();
    }

    function safeCameraUp(direction, preferredUp) {
      const viewDirection = direction.clone().normalize();
      let up = preferredUp.clone().normalize();
      if (Math.abs(up.dot(viewDirection)) > 0.95) {
        up = new THREE.Vector3(0, 1, 0);
      }
      if (Math.abs(up.dot(viewDirection)) > 0.95) {
        up = new THREE.Vector3(1, 0, 0);
      }
      return up;
    }

    function currentOrbitNormal() {
      if (!history.length) return new THREE.Vector3(0, 0, 1);
      const state = history[0];
      const position = new THREE.Vector3(state[0], state[1], state[2]);
      const velocity = new THREE.Vector3(state[3], state[4], state[5]);
      const normal = position.cross(velocity);
      if (normal.lengthSq() <= 1e-12) return new THREE.Vector3(0, 0, 1);
      return normal.normalize();
    }

    function updateControlsFromCode() {
      syncingCamera = true;
      controls.update();
      syncingCamera = false;
    }

    function setFollowSatellite(enabled) {
      followSatellite = Boolean(enabled && history.length);
      el.viewFollow.classList.toggle('following', followSatellite);
      el.viewFollow.setAttribute('aria-pressed', String(followSatellite));
      updateControlLimits(Math.max(R_EARTH, ...renderPositions.map((point) => point.length())));

      if (followSatellite) {
        const delta = satellite.position.clone().sub(controls.target);
        controls.target.copy(satellite.position);
        camera.position.add(delta);
        controls.userData = { userMoved: true };
        setActiveView(null);
      } else {
        controls.target.set(0, 0, 0);
      }
      updateControlsFromCode();
    }

    function updateFollowTarget() {
      if (!followSatellite) return;
      const delta = satellite.position.clone().sub(controls.target);
      if (delta.lengthSq() <= 1e-12) return;
      controls.target.copy(satellite.position);
      camera.position.add(delta);
      updateControlsFromCode();
    }

    function updateViewCompass() {
      const inverseCamera = camera.quaternion.clone().invert();
      const axes = [
        { element: compassAxes.x, vector: new THREE.Vector3(1, 0, 0) },
        { element: compassAxes.y, vector: new THREE.Vector3(0, 1, 0) },
        { element: compassAxes.z, vector: new THREE.Vector3(0, 0, 1) }
      ];

      for (const axis of axes) {
        const viewAxis = axis.vector.applyQuaternion(inverseCamera);
        const screenX = viewAxis.x;
        const screenY = -viewAxis.y;
        const screenLength = clamp(Math.hypot(screenX, screenY), 0.18, 1.0) * 24;
        const angle = Math.atan2(screenX, screenY);
        axis.element.style.height = `${screenLength}px`;
        axis.element.style.opacity = String(viewAxis.z > 0 ? 0.42 : 0.92);
        axis.element.style.transform = `rotate(${angle}rad)`;
      }
    }

    function zoomView(scale) {
      const offset = camera.position.clone().sub(controls.target);
      const nextDistance = clamp(offset.length() * scale, controls.minDistance, controls.maxDistance);
      offset.setLength(nextDistance);
      camera.position.copy(controls.target).add(offset);
      controls.userData = { userMoved: true };
      setActiveView(null);
      updateControlsFromCode();
      updateSatelliteMarkerScale();
    }

    function resizeRenderer() {
      const width = Math.max(1, el.scene.clientWidth);
      const height = Math.max(1, el.scene.clientHeight);
      renderer.setSize(width, height);
      camera.aspect = sceneAspect();
      camera.updateProjectionMatrix();
      updateSatelliteMarkerScale();
      updateAxisMarkerScale();
      updateViewCompass();
    }

    function sceneAspect() {
      return Math.max(1, el.scene.clientWidth) / Math.max(1, el.scene.clientHeight);
    }

    function showError(message) {
      el.error.textContent = message;
      el.error.style.display = 'block';
    }

    function hideError() {
      el.error.textContent = '';
      el.error.style.display = 'none';
    }

    function realtimeInfoText(payload, sample) {
      const satelliteData = payload.satellite || {};
      const lines = [
        `${satelliteData.name || 'Спутник'} / NORAD ${satelliteData.norad_cat_id || '-'}`,
        `UTC: ${formatUtc(sample?.sample_utc)}`,
        `Эпоха OMM: ${formatUtc(satelliteData.epoch_utc)}`,
        `Авто: каждые ${Math.round(REALTIME_REFRESH_MS / 60000)} мин`
      ];
      if (sample?.epoch_is_stale) {
        lines.push('Эпоха старше рекомендуемого окна.');
      }
      return lines.join('\n');
    }

    function formatUtc(value) {
      if (value === undefined || value === null || value === '') return '-';
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return String(value);
      return date.toISOString().replace('.000Z', 'Z');
    }

    function formatMetric(value, digits = 3) {
      if (value === undefined || value === null || value === '') return '-';
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return '-';
      const absolute = Math.abs(numeric);
      if (absolute > 0 && absolute < 1e-3) {
        return numeric.toExponential(Math.min(3, digits));
      }
      return numeric.toFixed(digits).replace(/\.?0+$/, '');
    }

    function formatNumber(value) {
      return Number(value).toPrecision(9).replace(/\.?0+$/, '');
    }

    function formatCompact(value) {
      return Number(value).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
    }

    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    function norm(vector) {
      return Math.sqrt(vector.reduce((sum, value) => sum + value * value, 0));
    }

    function dot(a, b) {
      return a.reduce((sum, value, index) => sum + value * b[index], 0);
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function rotationX(deg) {
      const a = degToRad(deg);
      const c = Math.cos(a);
      const s = Math.sin(a);
      return [[1, 0, 0], [0, c, -s], [0, s, c]];
    }

    function rotationZ(deg) {
      const a = degToRad(deg);
      const c = Math.cos(a);
      const s = Math.sin(a);
      return [[c, -s, 0], [s, c, 0], [0, 0, 1]];
    }

    function multiplyMatrices(a, b) {
      return a.map((row, i) => row.map((_, j) => a[i][0] * b[0][j] + a[i][1] * b[1][j] + a[i][2] * b[2][j]));
    }

    function multiplyMatrixVector(matrix, vector) {
      return matrix.map((row) => row[0] * vector[0] + row[1] * vector[1] + row[2] * vector[2]);
    }
  </script>
